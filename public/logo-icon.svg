<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Tile Gradients -->
    <linearGradient id="tileIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <linearGradient id="tileCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="tileRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <linearGradient id="tileEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  
  <!-- Subtle Inner Dotted Tech Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="10,12" opacity="0.4" />

  <!-- 4 Geometric Arcade / Brain Matrix Tiles -->
  <g opacity="0.95">
    <!-- Top-Left: Sudoku / Memory Grid Tile -->
    <rect x="108" y="108" width="132" height="132" rx="24" fill="url(#tileIndigo)" stroke="#818CF8" stroke-width="4" />
    <circle cx="148" cy="148" r="8" fill="#C7D2FE" />
    <circle cx="200" cy="148" r="8" fill="#C7D2FE" />
    <circle cx="148" cy="200" r="8" fill="#C7D2FE" />
    <circle cx="200" cy="200" r="8" fill="#FFFFFF" />

    <!-- Top-Right: Cyan Block (Tetromino inspired) -->
    <rect x="272" y="108" width="132" height="132" rx="24" fill="url(#tileCyan)" stroke="#67E8F9" stroke-width="4" />
    <rect x="302" y="138" width="72" height="72" rx="12" fill="#FFFFFF" opacity="0.2" />

    <!-- Bottom-Left: Rose Emoji / Arcade Button -->
    <rect x="108" y="272" width="132" height="132" rx="24" fill="url(#tileRose)" stroke="#FDA4AF" stroke-width="4" />
    <polygon points="174,310 196,354 152,354" fill="#FFFFFF" opacity="0.8" />

    <!-- Bottom-Right: Emerald Speed Block -->
    <rect x="272" y="272" width="132" height="132" rx="24" fill="url(#tileEmerald)" stroke="#6EE7B7" stroke-width="4" />
    <circle cx="338" cy="338" r="28" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.7" />
  </g>

  <!-- Central Electric Lightning Bolt (Brand Signature) -->
  <g filter="url(#boltShadow)">
    <path
      d="M 292 64 L 176 264 L 260 264 L 220 448 L 348 232 L 264 232 Z"
      fill="url(#boltGrad)"
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linejoin="round"
    />
  </g>

  <!-- Tech Corner Sparkles -->
  <circle cx="84" cy="84" r="6" fill="#38BDF8" opacity="0.8" />
  <circle cx="428" cy="428" r="6" fill="#EC4899" opacity="0.8" />
</svg>